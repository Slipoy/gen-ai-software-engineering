# XcodeGen spec: `xcodegen generate` turns this file into SupportDesk.xcodeproj.
# The .xcodeproj is generated (and committed so the project opens without extra tools),
# but this file is the source of truth: change targets and settings here, then regenerate.

name: SupportDesk

options:
  bundleIdPrefix: dev.slipoy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Swift 6 checks data races at compile time.
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  SupportDesk:
    type: application
    platform: iOS
    sources:
      - path: SupportDesk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.slipoy.SupportDesk
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"          # iPhone
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Switchboard
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    info:
      path: SupportDesk/Info.plist
      properties:
        # Where the API lives. The simulator shares the Mac's network, so localhost is the Mac.
        # Docker stack instead: http://localhost:8080/api
        API_BASE_URL: http://localhost:3000
        # iOS blocks plain http by default (App Transport Security); allow it only for local addresses.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}

  SupportDeskTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SupportDeskTests
    dependencies:
      - target: SupportDesk
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SupportDesk:
    build:
      targets:
        SupportDesk: all
        SupportDeskTests: [test]
    test:
      targets:
        - SupportDeskTests
