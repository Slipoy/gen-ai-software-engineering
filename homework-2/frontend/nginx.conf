# nginx for the built frontend. Two jobs:
#  1. serve the static files from `vite build` (dist/), with an SPA fallback so /tickets?ticket=… works on reload;
#  2. forward /api/* to the backend container: the same proxy as vite.config.ts in development,
#     so the browser sees one origin and CORS never comes up.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Imports are up to 5 MB; nginx rejects bigger bodies itself (the backend has the same limit).
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Basic hardening headers for the page itself.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # "backend" is the service name in docker-compose.yml; Docker's internal DNS resolves it.
    # The trailing slash strips the /api prefix: /api/tickets → http://backend:3000/tickets.
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Built assets have a content hash in their names (index-19gBTJZw.js), so they can be cached "forever":
    # a new build produces new names.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Everything else is the single-page app. index.html must never be cached, or users keep an old build.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ /index.html;
    }
}
